<!DOCTYPE html>
<html>
<head><title>Admin Login</title></head>
<body style="font-family: Arial; padding: 20px; max-width: 400px; margin: auto; background-color: #2c3e50; color: white;">
    <h2>Admin Access</h2>
    {% if error %}<p style="color:#ff6b6b;">{{ error }}</p>{% endif %}
    
    <form method="POST">
        <label>Admin Username</label><br>
        <input type="text" name="username" required style="width:100%; margin-bottom: 10px; padding: 8px;"><br>
        
        <label>Admin Password</label><br>
        <input type="password" name="password" required style="width:100%; margin-bottom: 20px; padding: 8px;"><br>

        <button type="submit" style="width:100%; padding: 10px; background: #e74c3c; color: white; border: none; font-weight: bold;">Login as Admin</button>
    </form>
    <br>
    <a href="/login" style="color: #3498db;">← Back to Normal Login</a>
</body>
</html>
