<!DOCTYPE html>
<html>
<head><title>Login</title></head>
<body style="font-family: Arial; padding: 20px; max-width: 400px; margin: auto;">
    <h2>Welcome! Please Login</h2>
    {% if error %}<p style="color:red;">{{ error }}</p>{% endif %}
    
    <form method="POST">
        <label>Username</label><br>
        <input type="text" name="username" required style="width:100%; margin-bottom: 10px;"><br>
        
        <label>Password</label><br>
        <input type="password" name="password" required style="width:100%; margin-bottom: 20px;"><br>

        <button type="submit" style="width:100%; padding: 10px; background: #007bff; color: white; border: none;">Login</button>
    </form>
    
    <p style="text-align: center;"><a href="/register">Don't have an account? Register here.</a></p>
    
    <hr style="margin-top: 30px;">
    <!-- Admin Login Button (Configured later) -->
    <p style="text-align: center; color: #666; font-size: 0.9em;">Are you an administrator?</p>
    <a href="/admin-login" style="display: block; text-align: center; color: #dc3545; text-decoration: none; border: 1px solid #dc3545; padding: 5px; border-radius: 4px;">Admin Login</a>
</body>
</html>
