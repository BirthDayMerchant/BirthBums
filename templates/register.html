<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — Birthday Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background:
        radial-gradient(1000px 600px at 10% -10%, rgba(99,102,241,0.18), transparent 60%),
        radial-gradient(900px 500px at 100% 0%, rgba(236,72,153,0.15), transparent 55%),
        #0b0d13;
    }
    .glass {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 10px 40px -12px rgba(0, 0, 0, 0.6);
      transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease;
    }
    .glass:hover {
      transform: translateY(-4px);
      border-color: rgba(255, 255, 255, 0.18);
      box-shadow: 0 20px 60px -16px rgba(0, 0, 0, 0.75);
    }
  </style>
</head>
<body class="grid min-h-screen place-items-center px-6 py-10 text-slate-200 font-sans antialiased selection:bg-indigo-500/40">

  <main class="w-full max-w-md">
    <!-- Brand -->
    <div class="mb-8 flex flex-col items-center gap-3 text-center">
      <div class="grid h-14 w-14 place-items-center rounded-2xl bg-gradient-to-br from-indigo-500 to-pink-500 shadow-lg shadow-indigo-500/30">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 8V4m-4 4h8m-9 4h10a2 2 0 012 2v4a2 2 0 01-2 2H7a2 2 0 01-2-2v-4a2 2 0 012-2zm2 0v-1a2 2 0 114 0v1" />
        </svg>
      </div>
      <div>
        <h1 class="text-2xl font-semibold tracking-tight text-white">Create an Account</h1>
        <p class="mt-1 text-sm text-slate-400">Join the Birthday Tracker community</p>
      </div>
    </div>

    <!-- Card -->
    <div class="glass rounded-2xl p-8">

      <!-- Flask error message -->
      {% if error %}
      <div class="mb-6 flex items-center gap-3 rounded-xl border border-red-400/30 bg-red-500/10 px-4 py-3 text-sm text-red-200">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0 text-red-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span>{{ error }}</span>
      </div>
      {% endif %}

      <form method="POST" class="space-y-4">
        <div>
          <label for="username" class="mb-1.5 block text-xs font-medium uppercase tracking-wider text-slate-400">
            Username <span class="text-pink-400">*</span>
          </label>
          <input id="username" type="text" name="username" required autocomplete="username"
            class="w-full rounded-xl border border-white/10 bg-white/5 px-4 py-2.5 text-sm text-white placeholder-slate-500 outline-none transition focus:border-indigo-400/50 focus:ring-2 focus:ring-indigo-500/30"
            placeholder="Choose a username" />
        </div>

        <div>
          <label for="password" class="mb-1.5 block text-xs font-medium uppercase tracking-wider text-slate-400">
            Password <span class="text-pink-400">*</span>
          </label>
          <input id="password" type="password" name="password" required autocomplete="new-password"
            class="w-full rounded-xl border border-white/10 bg-white/5 px-4 py-2.5 text-sm text-white placeholder-slate-500 outline-none transition focus:border-indigo-400/50 focus:ring-2 focus:ring-indigo-500/30"
            placeholder="Create a password" />
        </div>

        <div>
          <label for="name" class="mb-1.5 block text-xs font-medium uppercase tracking-wider text-slate-400">
            Full Name <span class="text-pink-400">*</span>
          </label>
          <input id="name" type="text" name="name" required autocomplete="name"
            class="w-full rounded-xl border border-white/10 bg-white/5 px-4 py-2.5 text-sm text-white placeholder-slate-500 outline-none transition focus:border-indigo-400/50 focus:ring-2 focus:ring-indigo-500/30"
            placeholder="Enter your full name" />
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label for="room_no" class="mb-1.5 block text-xs font-medium uppercase tracking-wider text-slate-400">
              Room No <span class="text-slate-600">(optional)</span>
            </label>
            <input id="room_no" type="text" name="room_no"
              class="w-full rounded-xl border border-white/10 bg-white/5 px-4 py-2.5 text-sm text-white placeholder-slate-500 outline-none transition focus:border-indigo-400/50 focus:ring-2 focus:ring-indigo-500/30"
              placeholder="e.g. 204" />
          </div>
          <div>
            <label for="dob" class="mb-1.5 block text-xs font-medium uppercase tracking-wider text-slate-400">
              Date of Birth <span class="text-slate-600">(optional)</span>
            </label>
            <input id="dob" type="date" name="dob"
              class="w-full rounded-xl border border-white/10 bg-white/5 px-4 py-2.5 text-sm text-slate-300 outline-none transition focus:border-indigo-400/50 focus:ring-2 focus:ring-indigo-500/30 [color-scheme:dark]" />
          </div>
        </div>

        <button type="submit"
          class="w-full rounded-xl bg-gradient-to-r from-indigo-500 to-pink-500 px-4 py-3 text-sm font-semibold text-white shadow-lg shadow-indigo-500/25 transition hover:brightness-110 active:scale-[0.99]">
          Register
        </button>
      </form>

      <p class="mt-6 text-center text-sm text-slate-400">
        Already have an account?
        <a href="/login" class="font-medium text-indigo-300 transition hover:text-indigo-200">Login here</a>
      </p>
    </div>
  </main>

</body>
</html>
